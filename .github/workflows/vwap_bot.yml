name: Paper Bot 3 - 9EMA + VWAP (5m)

on:
  schedule:
    - cron: "1-59/5 * * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "vwap_bot/paper_bot_vwap.py"
      - ".github/workflows/vwap_bot.yml"

permissions:
  contents: write

concurrency:
  group: paper-bot-vwap
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run one paper-trading check (bot 3, 9EMA + VWAP, 5m)
        run: python vwap_bot/paper_bot_vwap.py --once
      - name: Save state and results
        run: |
          git config user.name  "paper-bot-3"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A vwap_bot
          git diff --cached --quiet && exit 0
          git commit -m "paper bot 3 (9EMA+VWAP 5m) update $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
