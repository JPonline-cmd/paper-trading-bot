name: Paper Bot 2 - RSI exit (30m)

on:
  schedule:
    - cron: "4,34 * * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "rsi_bot/paper_bot_rsi.py"
      - ".github/workflows/rsi_bot.yml"

permissions:
  contents: write

concurrency:
  group: paper-bot-rsi
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run one paper-trading check (bot 2, RSI exit)
        run: python rsi_bot/paper_bot_rsi.py --once
      - name: Save state and results
        run: |
          git config user.name  "paper-bot-2"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A rsi_bot
          git diff --cached --quiet && exit 0
          git commit -m "paper bot 2 (RSI exit) update $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
